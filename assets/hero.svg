<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Hyperliquid Signal Atlas</title>
  <desc id="desc">YOR visual system title card for an evidence-first Hyperliquid event study with six matched days and 116,751 matched trades.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/><stop offset="0.6" stop-color="#050505"/><stop offset="1" stop-color="#2a0505"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#671515"/><stop offset="0.5" stop-color="#e84b4b"/><stop offset="1" stop-color="#ff8a7f"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#e84b4b" stroke-opacity="0.14"/></pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="720" fill="url(#wash)"/><rect width="1600" height="720" fill="url(#grid)" opacity="0.62"/>
  <path d="M0 610H1600" stroke="#e84b4b" stroke-opacity="0.24"/><path d="M0 610H1010" stroke="url(#rail)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="1290" cy="230" r="190" fill="none" stroke="#671515"/><circle cx="1290" cy="230" r="136" fill="none" stroke="#e84b4b" stroke-opacity="0.38"/><circle cx="1290" cy="230" r="5" fill="#ff8a7f" filter="url(#glow)"/>
  <path d="M1080 230h420M1290 20v420" stroke="#c4c4c4" stroke-opacity="0.12"/>
  <g fill="#c4c4c4" font-family="DM Mono, Consolas, monospace">
    <text x="92" y="92" font-size="18" letter-spacing="5" fill="#ff8a7f">YOR // RESEARCH ARCHIVE // ISSUE 03</text>
    <text x="92" y="254" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#f5eaea">HYPERLIQUID</text>
    <text x="92" y="350" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#e84b4b">SIGNAL ATLAS</text>
    <text x="96" y="414" font-size="21" letter-spacing="2" fill="#c4c4c4">A measured event study across sentiment windows, execution style, and trader structure.</text>
    <text x="96" y="474" font-size="15" letter-spacing="3" fill="#ff8a7f">VERIFIED DATA PIPELINE</text>
    <text x="96" y="520" font-size="15" letter-spacing="3" fill="#c4c4c4">LOCAL INTERFACE / STATIC EXPORTS / NO LIVE TRADING</text>
  </g>
  <g font-family="DM Mono, Consolas, monospace">
    <rect x="96" y="648" width="270" height="42" rx="4" fill="#050505" stroke="#e84b4b" stroke-opacity="0.52"/><rect x="384" y="648" width="270" height="42" rx="4" fill="#050505" stroke="#e84b4b" stroke-opacity="0.52"/><rect x="672" y="648" width="270" height="42" rx="4" fill="#050505" stroke="#e84b4b" stroke-opacity="0.52"/>
    <text x="116" y="675" font-size="15" fill="#f5eaea">116,751 MATCHED TRADES</text><text x="404" y="675" font-size="15" fill="#f5eaea">21 MATCHED TRADERS</text><text x="692" y="675" font-size="15" fill="#f5eaea">6 MATCHED DAYS</text>
  </g>
</svg>
