<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 460" role="img" aria-labelledby="title desc">
  <title id="title">Hyperliquid Signal Atlas pipeline</title>
  <desc id="desc">A five-stage data pipeline from raw exports through date matching, account-day aggregation, analysis, and evidence plates.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000000"/><stop offset="0.7" stop-color="#050505"/><stop offset="1" stop-color="#160303"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#671515"/><stop offset="1" stop-color="#ff8a7f"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#e84b4b"/></marker>
  </defs>
  <rect width="1500" height="460" fill="url(#bg)"/><path d="M60 74H1440M60 386H1440" stroke="#e84b4b" stroke-opacity="0.22"/>
  <g font-family="DM Mono, Consolas, monospace" fill="#f5eaea"><text x="60" y="52" font-size="16" letter-spacing="4" fill="#ff8a7f">YOR // SYSTEM FLOW // HYPERLIQUID SIGNAL ATLAS</text><text x="60" y="424" font-size="14" letter-spacing="2" fill="#c4c4c4">SIX OVERLAPPING DATES ARE PRESERVED AS A LIMITATION, NOT HIDDEN BY THE INTERFACE.</text></g>
  <g stroke="#e84b4b" stroke-width="2" marker-end="url(#arrow)"><path d="M276 230H328"/><path d="M556 230H608"/><path d="M836 230H888"/><path d="M1116 230H1168"/></g>
  <g font-family="DM Mono, Consolas, monospace">
    <g transform="translate(60 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">01 / INGEST</text><text x="22" y="88" font-size="24" fill="#f5eaea">Raw exports</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Fear/Greed feed</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Trader history</text><text x="22" y="190" font-size="12" fill="#ff8a7f">CSV / preserved inputs</text></g>
    <g transform="translate(340 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">02 / ALIGN</text><text x="22" y="88" font-size="24" fill="#f5eaea">Date match</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Normalize fields</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Coerce timestamps</text><text x="22" y="190" font-size="12" fill="#ff8a7f">6 matched calendar days</text></g>
    <g transform="translate(620 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">03 / AGGREGATE</text><text x="22" y="88" font-size="24" fill="#f5eaea">Account-day</text><text x="22" y="126" font-size="14" fill="#c4c4c4">PnL + activity</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Execution + fees</text><text x="22" y="190" font-size="12" fill="#9ad7b2">55 observed rows</text></g>
    <g transform="translate(900 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#671515" stroke-width="2"/><rect width="216" height="5" fill="#e84b4b"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">04 / ANALYZE</text><text x="22" y="88" font-size="24" fill="#f5eaea">Evidence cuts</text><text x="22" y="126" font-size="14" fill="#c4c4c4">Robustness tests</text><text x="22" y="153" font-size="14" fill="#c4c4c4">Segments + K-Means</text><text x="22" y="190" font-size="12" fill="#a5b4d0">Descriptive, not causal</text></g>
    <g transform="translate(1180 124)"><rect width="216" height="212" rx="5" fill="#050505" stroke="#e84b4b" stroke-width="2"/><rect width="216" height="5" fill="url(#accent)"/><text x="22" y="42" font-size="13" letter-spacing="2" fill="#ff8a7f">05 / PRESENT</text><text x="22" y="88" font-size="24" fill="#f5eaea">Signal Atlas</text><text x="22" y="126" font-size="14" fill="#c4c4c4">11 chart plates</text><text x="22" y="153" font-size="14" fill="#c4c4c4">11 data tables</text><text x="22" y="190" font-size="12" fill="#ff8a7f">Local Streamlit deck</text></g>
  </g>
</svg>
